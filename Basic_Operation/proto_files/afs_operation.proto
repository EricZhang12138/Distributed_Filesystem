syntax = "proto3";
package afs_operation;


message MakeDir_request{
    string directory = 1;
    int32 mode = 2;
}
message MakeDir_response{
    bool success =1;
}

message Delete_request{
    string directory = 1;
    string client_id = 2;
}

message Delete_response{
    bool success = 1;
}

message RenameRequest {                // for rename calls 
    string filename = 1;     // Current name
    string new_filename = 2; // New name
    string directory = 3;
    string new_directory = 4;
    string client_id = 5;
}

message RenameResponse {
    bool success = 1;
}

message InitialiseRequest{
    string code_to_initialise = 1;
    string client_id = 2;
}
message InitialiseResponse{
    string root_path = 1;
}

message FileRequest {
    string filename = 1;
    int64 timestamp = 2;
    bytes content = 3;
    string directory = 4;
    string client_id = 5;
}

message FileResponse {
    bytes content = 1;
    int32 length = 2;
    int64 timestamp = 3;
    int32 update_bit =4;  // update = 1 -> needs to update content on the client otherwise no
}

message ListDirectoryRequest{
    string directory =1;
}

message ListDirectoryResponse{
    map<string,string> entry_list =1;
}

message GetAttrRequest {
    string filename = 1;
    string directory = 2;
}

message GetAttrResponse {
    int64 size = 1;         // File size in bytes
    int64 mtime = 2;        // Last modification time (nanoseconds)
    uint32 mode = 3;        // File mode (e.g., 0755 | S_IFREG)
    int64 atime = 4;        // Last access time (nanoseconds)
    int64 ctime = 5;        // Last status change time (nanoseconds)
    uint32 nlink = 6;       // Number of hard links
    uint32 uid = 7;         // User ID
    uint32 gid = 8;         // Group ID
}


message SubscribeRequest {
  string client_id = 1;
  // No file_ids here!
}


message Notification {
    string directory = 2;    // Useful to distinguish files with same name in different folders
    string new_directory = 3;       // this is for rename only
    string message = 4;      // e.g. "UPDATE", "DELETE", "RENAME"
    int64 timestamp = 5;     // The last time the file was changed recorded on the server to update the version of the file in cache
}

message FileUsers {
  repeated string users = 1;
}

message GetStatusRequest {

}

message GetStatusResponse {
    repeated string connected_clients = 1;
    map<string, FileUsers> file_to_clients = 2;
}


// === Group A: rmdir ===
message Rmdir_request  { string directory = 1; string client_id = 2; }
message Rmdir_response { bool success = 1; }

// === Group B: chmod ===
message Chmod_request  { string directory = 1; string filename = 2; uint32 mode = 3; string client_id = 4; }
message Chmod_response { bool success = 1; int64 timestamp = 2; }

// === Group C: chown ===
message Chown_request  { string directory = 1; string filename = 2; uint32 uid = 3; uint32 gid = 4; string client_id = 5; }
message Chown_response { bool success = 1; int64 timestamp = 2; }

// === Group D: utimens ===
message Utimens_request  { string directory = 1; string filename = 2; int64 atime = 3; int64 mtime = 4; string client_id = 5; }
message Utimens_response { bool success = 1; }

// === Group E: symlink / readlink ===
message Symlink_request  { string target = 1; string linkpath_dir = 2; string linkpath_name = 3; string client_id = 4; }
message Symlink_response { bool success = 1; }
message Readlink_request  { string directory = 1; string filename = 2; }
message Readlink_response { string target = 1; bool success = 2; }

// === Group F: server-side truncate ===
message Truncate_request  { string directory = 1; string filename = 2; int64 size = 3; string client_id = 4; }
message Truncate_response { bool success = 1; int64 timestamp = 2; }

// === Group G: fsync (reuses FileRequest for streamed payload) ===
message Fsync_response { bool success = 1; int64 timestamp = 2; }

// === Group H: statfs ===
message Statfs_request  {}
message Statfs_response {
    uint64 bsize = 1; uint64 frsize = 2;
    uint64 blocks = 3; uint64 bfree = 4; uint64 bavail = 5;
    uint64 files = 6; uint64 ffree = 7;
}

// === Group I: xattr ===
message SetXattr_request  { string directory = 1; string filename = 2; string name = 3; bytes value = 4; int32 flags = 5; string client_id = 6; }
message SetXattr_response { bool success = 1; }
message GetXattr_request  { string directory = 1; string filename = 2; string name = 3; }
message GetXattr_response { bytes value = 1; bool found = 2; }
message ListXattr_request  { string directory = 1; string filename = 2; }
message ListXattr_response { repeated string names = 1; }
message RemoveXattr_request  { string directory = 1; string filename = 2; string name = 3; string client_id = 4; }
message RemoveXattr_response { bool success = 1; }


service operators{
    rpc request_dir (InitialiseRequest) returns (InitialiseResponse);
    rpc open (FileRequest) returns (stream FileResponse);
    rpc close (stream FileRequest) returns (FileResponse);
    //rpc compare (FileRequest) returns (stream FileResponse);
    rpc ls (ListDirectoryRequest) returns (ListDirectoryResponse);
    rpc getattr (GetAttrRequest) returns (GetAttrResponse);
    rpc rename (RenameRequest) returns (RenameResponse);
    rpc mkdir (MakeDir_request) returns (MakeDir_response);
    rpc unlink (Delete_request) returns (Delete_response);
    rpc rmdir       (Rmdir_request)        returns (Rmdir_response);
    rpc chmod       (Chmod_request)        returns (Chmod_response);
    rpc chown       (Chown_request)        returns (Chown_response);
    rpc utimens     (Utimens_request)      returns (Utimens_response);
    rpc symlink     (Symlink_request)      returns (Symlink_response);
    rpc readlink    (Readlink_request)     returns (Readlink_response);
    rpc truncate    (Truncate_request)     returns (Truncate_response);
    rpc flush_file  (stream FileRequest)   returns (Fsync_response);
    rpc statfs      (Statfs_request)       returns (Statfs_response);
    rpc setxattr    (SetXattr_request)     returns (SetXattr_response);
    rpc getxattr    (GetXattr_request)     returns (GetXattr_response);
    rpc listxattr   (ListXattr_request)    returns (ListXattr_response);
    rpc removexattr (RemoveXattr_request)  returns (RemoveXattr_response);
    rpc subscribe(SubscribeRequest) returns (stream Notification);
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}



