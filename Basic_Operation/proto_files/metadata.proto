syntax = "proto3";
package metadata;

import "afs_operation.proto";

// === Metadata-specific messages ===

message MetadataInitRequest {
    string client_id = 1;
}

message MetadataInitResponse {
    string root_path = 1;
    // data_server_address removed in Phase 2 — clients discover servers per-file via Lookup/CreateFile
}

message LookupRequest {
    string path = 1;
}

message LookupResponse {
    string data_server_address = 1;
    string data_server_root = 2;   // The data server's root directory (so client can build full paths)
}

message RegisterRequest {
    string address = 1;
    string root_dir = 2;
}

message RegisterResponse {
    bool success = 1;
}

message HeartbeatRequest {
    string address = 1;
}

message HeartbeatResponse {
    bool success = 1;
}

// === Phase 2: New messages ===

message CreateFileRequest {
    string path = 1;        // Full path e.g. "/subdir/file.txt"
    uint32 mode = 2;
    string client_id = 3;
}

message CreateFileResponse {
    string data_server_address = 1;
    bool success = 2;
    string data_server_root = 3;   // The data server's root directory
}

message NotifyFileChangeRequest {
    string path = 1;         // Full server-side path of the file
    string message = 2;      // "UPDATE", "DELETE", "RENAME"
    int64 timestamp = 3;
    string client_id = 4;    // Which client triggered this (to exclude from notification)
    int64 new_size = 5;      // Updated file size after mutation
    string new_path = 6;     // For rename: the new path
}

message NotifyFileChangeResponse {
    bool success = 1;
}

message RegisterFileInterestRequest {
    string path = 1;         // Server-side path the client is interested in
    string client_id = 2;
}

message RegisterFileInterestResponse {
    bool success = 1;
}

service MetadataService {
    // Client initialization — returns root path
    rpc Init (MetadataInitRequest) returns (MetadataInitResponse);

    // File lookup — returns which data server holds a file
    rpc Lookup (LookupRequest) returns (LookupResponse);

    // File creation — picks a data server, creates tree entry, returns address
    rpc CreateFile (CreateFileRequest) returns (CreateFileResponse);

    // Data server registration and heartbeat
    rpc RegisterDataServer (RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

    // Subscriber system — clients subscribe here for cache invalidation
    rpc Subscribe (afs_operation.SubscribeRequest) returns (stream afs_operation.Notification);

    // Data server -> metadata server: report file mutations
    rpc NotifyFileChange (NotifyFileChangeRequest) returns (NotifyFileChangeResponse);

    // Client -> metadata server: register interest in a file (for notifications)
    rpc RegisterFileInterest (RegisterFileInterestRequest) returns (RegisterFileInterestResponse);

    // Structural RPCs — handled locally by metadata server's namespace tree
    rpc ls          (afs_operation.ListDirectoryRequest)  returns (afs_operation.ListDirectoryResponse);
    rpc getattr     (afs_operation.GetAttrRequest)        returns (afs_operation.GetAttrResponse);
    rpc mkdir       (afs_operation.MakeDir_request)       returns (afs_operation.MakeDir_response);
    rpc unlink      (afs_operation.Delete_request)        returns (afs_operation.Delete_response);
    rpc rmdir       (afs_operation.Rmdir_request)         returns (afs_operation.Rmdir_response);
    rpc rename      (afs_operation.RenameRequest)         returns (afs_operation.RenameResponse);
    rpc chmod       (afs_operation.Chmod_request)         returns (afs_operation.Chmod_response);
    rpc chown       (afs_operation.Chown_request)         returns (afs_operation.Chown_response);
    rpc utimens     (afs_operation.Utimens_request)       returns (afs_operation.Utimens_response);
    rpc symlink     (afs_operation.Symlink_request)       returns (afs_operation.Symlink_response);
    rpc readlink    (afs_operation.Readlink_request)      returns (afs_operation.Readlink_response);
    rpc statfs      (afs_operation.Statfs_request)        returns (afs_operation.Statfs_response);
    rpc setxattr    (afs_operation.SetXattr_request)      returns (afs_operation.SetXattr_response);
    rpc getxattr    (afs_operation.GetXattr_request)      returns (afs_operation.GetXattr_response);
    rpc listxattr   (afs_operation.ListXattr_request)     returns (afs_operation.ListXattr_response);
    rpc removexattr (afs_operation.RemoveXattr_request)   returns (afs_operation.RemoveXattr_response);
}
